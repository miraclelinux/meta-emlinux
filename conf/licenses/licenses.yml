# format
#
# Format 1:
# debian binary package name:
#   licenses: [
#     "LICENSE_NAME_A",
#     "LICENSE_NAME_B"
#   ]
#
# Format 2:
# debian binary package name:
#  licenses:
#    - LICENSE_NAME_A
#    - LICENSE_NAME_B
#
# Format 3:
# debian binary package name:
#   licenses:
#     license:
#       - LICENSE_NAME_A
#       - LICENSE_NAME_B
#       - LICENSE_NAME_C
#     text:
#       LICENSE_NAME_C: /path/to/license text file
#
# Format 3 can put License text in a file if license is not defined SPDX License ID list
# (https://spdx.org/licenses/).
# Path to license file can be used both absolute and relative path from <layer>/conf/licenses/license_texts.
# If use relative path, text file should be in conf/licenses/license_texts in your layer.
# create_sbom.py use <layer>/conf/licenses/license_texts as base path.
# For example, adwaita-icon-theme package, we defined CC-BY-3.0-US license following line.
# CC-BY-3.0-US: adwaita-icon-theme/CC-BY-SA-3.0-US.txt
# Above example, create_sbom.py create file path as "meta-emlinux/conf/licenses/license_texts/adwaita-icon-theme/CC-BY-SA-3.0-US.txt"
#
# Layer is able to have it own licenses.yml file in <layer>/conf/licenses directory.
# If custom layer is called meta-custom, you can put meta-custom/conf/licenses/licenses.yml file.
# If meta-custom/conf/licenses/licenses.yml contais following line
# MY-LICENSE: myapp/license.txt
# create_sbom.py will read meta-custom/conf/licenses/license_texts/myapp/license.txt
#
# In this file, some packages use Format 3 style definition.
adwaita-icon-theme:
  licenses:
    license:
      - CC-BY-SA-3.0 or LGPL-3
      - CC-BY-SA-3.0-US or LGPL-3
      - GPL-unspecified
      - CC-BY-SA-4.0
      - GFDL-1.2+ or CC-BY-SA-3.0-Unported or CC-BY-SA-2.0-IT
      - CC-BY-3.0-US
    text:
      GPL-unspecified: adwaita-icon-theme/GPL-unspecified.txt
      CC-BY-SA-2.0-IT: adwaita-icon-theme/CC-BY-SA-2.0-IT.txt
      CC-BY-SA-3.0-Unported: adwaita-icon-theme/CC-BY-SA-3.0-Unported.txt
      CC-BY-SA-3.0-US: adwaita-icon-theme/CC-BY-SA-3.0-US.txt
